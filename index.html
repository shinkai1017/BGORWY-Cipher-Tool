<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BGORWY Cipher | Unlock</title><style>body{font-family:system-ui;background:#101827;color:#f5f7fb;min-height:100vh;display:grid;place-items:center;margin:0}.card{width:min(90vw,420px);background:#1b293d;padding:30px;border-radius:16px}input,button{font:inherit;padding:12px;border-radius:8px;box-sizing:border-box;width:100%;margin-top:12px}input{background:#0e1726;color:white;border:1px solid #64748b}button{background:#dbeafe;border:0;cursor:pointer}p{color:#cbd5e1}#status{min-height:1.5em}</style></head><body><div class="card"><h1>BGORWY Cipher</h1><p>パスワードを入力してください。</p><form id="form"><input id="pw" type="password" autocomplete="current-password" required aria-label="パスワード"><button id="unlock" type="submit">ロックを解除</button></form><p id="status" role="status"></p></div><script>
const dec=new TextDecoder();
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function keyFor(password,salt,iterations){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('unlock'),status=document.getElementById('status');button.disabled=true;status.textContent='復号しています…';try{const r=await fetch('./vault.json',{cache:'no-store'});if(!r.ok)throw Error('vault.json を取得できません');const v=await r.json();if(v.version!==1||v.algorithm!=='AES-256-GCM'||v.kdf!=='PBKDF2-SHA256'||!Number.isInteger(v.iterations)||v.iterations<100000)throw Error('データ形式が不正です');const key=await keyFor(document.getElementById('pw').value,b64(v.salt),v.iterations);const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(v.iv)},key,b64(v.ciphertext));document.getElementById('pw').value='';const html=dec.decode(raw);document.open();document.write(html);document.close()}catch(err){status.textContent=err.name==='OperationError'?'パスワードが違うか、データが破損しています。':'読み込みに失敗しました: '+err.message;button.disabled=false}});
</script></body></html>
